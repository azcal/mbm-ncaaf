name: mbm-ncaaf-paper-open
# Runs 40 minutes after the Monday board so it can copy that run's Monday-line claims
# into an append-only ledger. Two crons because Actions ignores daylight saving.
on:
  schedule:
    # Hourly tick; slot_gate.py decides whether a tick does work, because GitHub starts
    # scheduled jobs hours late. Slots (America/Edmonton): open=mon@09:40
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# One run at a time. A second tick waits, then its gate sees the first one's marker.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      slot: ${{ steps.g.outputs.slot }}
      name: ${{ steps.g.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            slot_gate.py
            .slots/paper_open.txt
          sparse-checkout-cone-mode: false
      - id: g
        run: python3 slot_gate.py
        env:
          SLOTS: "open=mon@09:40"
          SLOT_MARKER: ".slots/paper_open.txt"
          SLOT_EVENT: ${{ github.event_name }}
  paper:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install pandas numpy requests
      - run: python paper_open.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: commit
        run: |
          git config user.name "mbm-ncaaf"
          git config user.email "mbm-ncaaf@users.noreply.github.com"
          git add logs/paper_open.csv
          git commit -m "paper_open $(date -u +%F)" || echo "nothing new"
          git pull --rebase && git push
      # Last step on purpose: the slot is only marked done when everything above succeeded,
      # so a failed run is retried by the next hourly tick.
      - name: record slot
        if: needs.gate.outputs.slot != 'manual'
        run: |
          mkdir -p .slots && echo "${{ needs.gate.outputs.slot }}" > .slots/paper_open.txt
          git config user.name mbm-bot
          git config user.email mbm-bot@users.noreply.github.com
          git add .slots/paper_open.txt
          git commit -q -m "slot paper_open ${{ needs.gate.outputs.slot }}" || exit 0
          for i in 1 2 3 4; do
            if git pull -q --rebase --autostash && git push -q; then exit 0; fi
            sleep $((i * 4))
          done
          echo "could not record the slot; the next tick will run this again"
