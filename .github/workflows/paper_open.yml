name: mbm-ncaaf-paper-open
# Runs 40 minutes after the Monday board so it can copy that run's Monday-line claims
# into an append-only ledger. Two crons because Actions ignores daylight saving.
on:
  schedule:
    - cron: "40 15 * 3-10 1"      # Monday 9:40am MDT
    - cron: "40 16 * 1-2,11-12 1" # Monday 9:40am MST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy requests
      - run: python paper_open.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: commit
        run: |
          git config user.name "mbm-ncaaf"
          git config user.email "mbm-ncaaf@users.noreply.github.com"
          git add logs/paper_open.csv
          git commit -m "paper_open $(date -u +%F)" || echo "nothing new"
          git pull --rebase && git push
